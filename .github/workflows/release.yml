# Builds Canalis for Windows and Linux when a version tag (v1.2.3) is pushed, and attaches the
# downloads to a draft GitHub release: a setup exe for Windows, and for Linux a tar.gz with the
# program and its install scripts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.0), or a branch to only test the builds"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: choco install innosetup --no-progress -y
      - name: Build the setup exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage\packaging | Out-Null
          Copy-Item target\release\canalis.exe, install-windows.ps1, uninstall-windows.ps1 stage
          Copy-Item packaging\windows-hardware-monitor.ps1 stage\packaging
          $icon = (Get-ChildItem target\release\build\canalis-*\out\canalis.ico | Select-Object -First 1).FullName
          $version = $env:TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$PWD\stage" "/DIconFile=$icon" "/DOutputDir=$PWD" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup could not build the installer' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: canalis-setup-*.exe

  linux:
    # The oldest supported Ubuntu, so the binary runs on older glibc as well as on Arch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # The last line is what GPUI needs: X11 and Wayland input, fonts and Vulkan.
      - run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="canalis-$TAG-linux-x64"
          mkdir -p "$name/packaging"
          cp target/release/canalis install.sh uninstall.sh README.md "$name/"
          cp packaging/70-tryx-panorama.rules packaging/canalis.desktop packaging/canalis.service "$name/packaging/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: canalis-*-linux-x64.tar.gz

  release:
    needs: [windows, linux]
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum canalis-* > SHA256SUMS.txt
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" canalis-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Canalis $TAG" --notes "Windows and Linux builds of Canalis $TAG."
