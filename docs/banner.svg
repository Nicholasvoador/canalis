<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <linearGradient id="graph-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DEF750" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#DEF750" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="graph-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DEF750" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#DEF750" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#DEF750" stop-opacity="0.9"/>
    </linearGradient>
    <g id="home" fill="none" stroke="#DEF750" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3.5l9 7"/>
      <path d="M5.5 8.75V19a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5V8.75"/>
      <path d="M9.75 20.5v-5a1 1 0 0 1 1-1h2.5a1 1 0 0 1 1 1v5"/>
    </g>
    <g id="panorama" fill="none" stroke="#DEF750" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.75 6.25Q12 8.75 21.25 6.25V17.75Q12 15.25 2.75 17.75Z"/>
      <path d="m6.25 14.75 4-4.25 3 3 1.75-1.5 2.75 2.75"/>
      <circle cx="16.9" cy="9.9" r="1.05" fill="#DEF750" stroke="none"/>
    </g>
    <g id="settings" fill="none" stroke="#DEF750" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.17 4.93 10.58 2.51A9.6 9.6 0 0 1 13.42 2.51L13.83 4.93A7.3 7.3 0 0 1 15.71 5.71L17.71 4.28A9.6 9.6 0 0 1 19.72 6.29L18.29 8.29A7.3 7.3 0 0 1 19.07 10.17L21.49 10.58A9.6 9.6 0 0 1 21.49 13.42L19.07 13.83A7.3 7.3 0 0 1 18.29 15.71L19.72 17.71A9.6 9.6 0 0 1 17.71 19.72L15.71 18.29A7.3 7.3 0 0 1 13.83 19.07L13.42 21.49A9.6 9.6 0 0 1 10.58 21.49L10.17 19.07A7.3 7.3 0 0 1 8.29 18.29L6.29 19.72A9.6 9.6 0 0 1 4.28 17.71L5.71 15.71A7.3 7.3 0 0 1 4.93 13.83L2.51 13.42A9.6 9.6 0 0 1 2.51 10.58L4.93 10.17A7.3 7.3 0 0 1 5.71 8.29L4.28 6.29A9.6 9.6 0 0 1 6.29 4.28L8.29 5.71A7.3 7.3 0 0 1 10.17 4.93Z"/>
      <circle cx="12" cy="12" r="3"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#1A1B1F"/>

    <!-- Live-stats graph along the bottom, like the dashboard's network card -->
    <path transform="translate(0 30)" d="M420 400V352C470 352 490 318 530 322S600 366 650 360 720 300 770 306 850 372 905 364 975 290 1030 300 1110 360 1160 350 1240 312 1280 318V400Z" fill="url(#graph-fill)"/>
    <path transform="translate(0 30)" d="M420 352C470 352 490 318 530 322S600 366 650 360 720 300 770 306 850 372 905 364 975 290 1030 300 1110 360 1160 350 1240 312 1280 318" fill="none" stroke="url(#graph-fade)" stroke-width="3" stroke-linecap="round"/>

    <!-- The app's lime sidebar with the logo -->
    <rect width="420" height="400" fill="#DEF750"/>
    <path transform="translate(98 88) scale(7)" fill="#0B0B0C" fill-rule="evenodd" d="M5.2 6.6Q16 10 26.8 6.6A1.6 1.6 0 0 1 28.8 8.1V23.9A1.6 1.6 0 0 1 26.8 25.4Q16 22 5.2 25.4A1.6 1.6 0 0 1 3.2 23.9V8.1A1.6 1.6 0 0 1 5.2 6.6ZM12 14.6a1.4 1.4 0 0 0 0 2.8h8a1.4 1.4 0 0 0 0-2.8Z"/>
  </g>

  <text x="476" y="170" font-size="92" font-weight="700" letter-spacing="3" fill="#F4F4F5">CANALIS</text>
  <text x="480" y="220" font-size="26" fill="#A3A7AE">Control the TRYX Panorama cooler screen on Windows and Linux</text>

  <g font-size="19" fill="#E8E9EB">
    <rect x="480" y="252" width="236" height="46" rx="23" fill="#25272C" stroke="#373A41"/>
    <use href="#panorama" x="498" y="263"/>
    <text x="532" y="281">14 built-in themes</text>

    <rect x="730" y="252" width="206" height="46" rx="23" fill="#25272C" stroke="#373A41"/>
    <use href="#home" x="748" y="263"/>
    <text x="782" y="281">Live dashboard</text>

    <rect x="950" y="252" width="166" height="46" rx="23" fill="#25272C" stroke="#373A41"/>
    <use href="#settings" x="968" y="263"/>
    <text x="1002" y="281">Fan curves</text>
