[package]
name = "panorama"
version = "0.3.0"
edition = "2024"
description = "Control app for the TRYX Panorama cooler screen on Linux and Windows (KANALI replacement)"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
eframe = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true
